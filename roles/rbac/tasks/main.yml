---
# rbac - Superuser audit, org/team/role assignments, activity stream

- name: Merge RBAC baseline with customer overrides
  ansible.builtin.set_fact:
    _rbac: "{{ rbac_baseline | combine(rbac_overrides | default({}), recursive=true) }}"

- name: Query superusers
  ansible.builtin.uri:
    url: "{{ aap_hostname }}/api/v2/users/?is_superuser=true"
    method: GET
    url_username: "{{ omit if aap_oauthtoken is defined else (aap_username | default(omit)) }}"
    url_password: "{{ omit if aap_oauthtoken is defined else (aap_password | default(omit)) }}"
    force_basic_auth: "{{ aap_username is defined and aap_oauthtoken is not defined }}"
    headers: "{{ {'Authorization': 'Bearer ' + aap_oauthtoken} if aap_oauthtoken is defined else {} }}"
    validate_certs: "{{ aap_validate_certs | default(true) }}"
    status_code: [200]
  register: _superusers
  failed_when: false
  no_log: true

- name: Query system settings
  ansible.builtin.uri:
    url: "{{ aap_hostname }}/api/v2/settings/system/"
    method: GET
    url_username: "{{ omit if aap_oauthtoken is defined else (aap_username | default(omit)) }}"
    url_password: "{{ omit if aap_oauthtoken is defined else (aap_password | default(omit)) }}"
    force_basic_auth: "{{ aap_username is defined and aap_oauthtoken is not defined }}"
    headers: "{{ {'Authorization': 'Bearer ' + aap_oauthtoken} if aap_oauthtoken is defined else {} }}"
    validate_certs: "{{ aap_validate_certs | default(true) }}"
    status_code: [200]
  register: _system_settings
  failed_when: false
  no_log: true

- name: Query job settings
  ansible.builtin.uri:
    url: "{{ aap_hostname }}/api/v2/settings/jobs/"
    method: GET
    url_username: "{{ omit if aap_oauthtoken is defined else (aap_username | default(omit)) }}"
    url_password: "{{ omit if aap_oauthtoken is defined else (aap_password | default(omit)) }}"
    force_basic_auth: "{{ aap_username is defined and aap_oauthtoken is not defined }}"
    headers: "{{ {'Authorization': 'Bearer ' + aap_oauthtoken} if aap_oauthtoken is defined else {} }}"
    validate_certs: "{{ aap_validate_certs | default(true) }}"
    status_code: [200]
  register: _job_settings
  failed_when: false
  no_log: true

- name: Set RBAC API availability
  ansible.builtin.set_fact:
    _rbac_api_available: "{{ _superusers.status | default(0) == 200 }}"
    _sys_api_available: "{{ _system_settings.status | default(0) == 200 }}"
    _job_api_available: "{{ _job_settings.status | default(0) == 200 }}"

- name: Evaluate RBAC checks
  ansible.builtin.set_fact:
    aap_secure_api_results: "{{ aap_secure_api_results | default([]) + _rbac_results }}"
  vars:
    _su_count: "{{ _superusers.json.count | default(0) }}"
    _su_names: "{{ _superusers.json.results | default([]) | map(attribute='username') | list }}"
    _sys: "{{ _system_settings.json | default({}) }}"
    _jobs: "{{ _job_settings.json | default({}) }}"
    _rbac_results:
      - name: Superuser Count
        domain: RBAC
        status: >-
          {%- if not _rbac_api_available -%}SKIPPED
          {%- elif (_su_count | int) <= (_rbac.max_superusers | int) -%}PASS
          {%- elif (_su_count | int) <= (_rbac.max_superusers | int) + 2 -%}WARNING
          {%- else -%}FAIL{%- endif -%}
        current_value: "{{ _su_count }} superuser(s): {{ _su_names | join(', ') }}"
        recommended_value: "<= {{ _rbac.max_superusers }}"
        description: "Minimize number of superuser accounts"
        remediation: "Remove unnecessary superuser privileges"
        reference: "AAP Secure 2.7 - Recommended security practices for access controls"

      - name: Activity Stream
        domain: RBAC
        status: >-
          {%- if not _sys_api_available -%}SKIPPED
          {%- elif _sys.ACTIVITY_STREAM_ENABLED | default(false) -%}PASS
          {%- else -%}FAIL{%- endif -%}
        current_value: "{{ _sys.ACTIVITY_STREAM_ENABLED | default('N/A - API unavailable') }}"
        recommended_value: "true"
        description: "Activity stream captures audit trail of all changes"
        remediation: "Enable Activity Stream in Settings > System"
        reference: "AAP Secure 2.7 - Implement security control for system administrators"

      - name: Activity Stream for Inventory Sync
        domain: RBAC
        status: >-
          {%- if not _sys_api_available -%}SKIPPED
          {%- elif _sys.ACTIVITY_STREAM_ENABLED_FOR_INVENTORY_SYNC | default(false) -%}PASS
          {%- else -%}WARNING{%- endif -%}
        current_value: "{{ _sys.ACTIVITY_STREAM_ENABLED_FOR_INVENTORY_SYNC | default('N/A - API unavailable') }}"
        recommended_value: "true"
        description: "Activity stream for inventory sync operations"
        remediation: "Enable Activity Stream for Inventory Sync in Settings > System"
        reference: "AAP Secure 2.7 - Implement security control for system administrators"

      - name: Default Job Timeout
        domain: RBAC
        status: >-
          {%- if not _job_api_available -%}SKIPPED
          {%- elif (_jobs.DEFAULT_JOB_TIMEOUT | default(0) | int) > 0 -%}PASS
          {%- else -%}WARNING{%- endif -%}
        current_value: "{{ _jobs.DEFAULT_JOB_TIMEOUT | default('N/A - API unavailable') }}"
        recommended_value: "> 0 (recommended: {{ controller_baseline.DEFAULT_JOB_TIMEOUT }})"
        description: "Job timeout prevents runaway jobs (0 = no timeout)"
        remediation: "Set DEFAULT_JOB_TIMEOUT to {{ controller_baseline.DEFAULT_JOB_TIMEOUT }}"
        reference: "AAP Secure 2.7 - Recommended security practices for access controls"

      - name: Insights Tracking
        domain: RBAC
        status: >-
          {%- if not _sys_api_available -%}SKIPPED
          {%- elif _sys.INSIGHTS_TRACKING_STATE | default(false) -%}PASS
          {%- else -%}WARNING{%- endif -%}
        current_value: "{{ _sys.INSIGHTS_TRACKING_STATE | default('N/A - API unavailable') }}"
        recommended_value: "true"
        description: "Red Hat Insights tracking for proactive support"
        remediation: "Enable INSIGHTS_TRACKING_STATE in Settings > System"
        reference: "AAP Secure 2.7 - Harden the platform security posture"
