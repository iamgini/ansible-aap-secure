---
# credentials - External vault integration, no_log usage, plaintext detection

- name: Merge credentials baseline with customer overrides
  ansible.builtin.set_fact:
    _cred: "{{ credentials_baseline | combine(credentials_overrides | default({}), recursive=true) }}"

- name: Query credential types
  ansible.builtin.uri:
    url: "{{ aap_hostname }}/api/controller/v2/credential_types/?managed=true"
    method: GET
    url_username: "{{ omit if aap_oauthtoken is defined else (aap_username | default(omit)) }}"
    url_password: "{{ omit if aap_oauthtoken is defined else (aap_password | default(omit)) }}"
    force_basic_auth: "{{ aap_username is defined and aap_oauthtoken is not defined }}"
    headers: "{{ {'Authorization': 'Bearer ' + aap_oauthtoken} if aap_oauthtoken is defined else {} }}"
    validate_certs: "{{ aap_validate_certs | default(true) }}"
    status_code: [200]
  register: _cred_types
  failed_when: false
  no_log: true

- name: Query credentials
  ansible.builtin.uri:
    url: "{{ aap_hostname }}/api/controller/v2/credentials/?page_size=200"
    method: GET
    url_username: "{{ omit if aap_oauthtoken is defined else (aap_username | default(omit)) }}"
    url_password: "{{ omit if aap_oauthtoken is defined else (aap_password | default(omit)) }}"
    force_basic_auth: "{{ aap_username is defined and aap_oauthtoken is not defined }}"
    headers: "{{ {'Authorization': 'Bearer ' + aap_oauthtoken} if aap_oauthtoken is defined else {} }}"
    validate_certs: "{{ aap_validate_certs | default(true) }}"
    status_code: [200]
  register: _credentials
  failed_when: false
  no_log: true

- name: Set credential API availability
  ansible.builtin.set_fact:
    _cred_api_available: "{{ _credentials.status | default(0) == 200 }}"

- name: Analyze credential usage
  when: _cred_api_available
  ansible.builtin.set_fact:
    _total_creds: "{{ _credentials.json.count | default(0) }}"
    _cred_list: "{{ _credentials.json.results | default([]) }}"
    _external_vault_creds: >-
      {{ _credentials.json.results | default([])
         | selectattr('credential_type_name', 'defined')
         | selectattr('credential_type_name', 'search', '(?i)(vault|cyberark|conjur|aws.*secret|azure.*key)')
         | list }}

- name: Set empty credential data when API unavailable
  when: not _cred_api_available
  ansible.builtin.set_fact:
    _total_creds: 0
    _cred_list: []
    _external_vault_creds: []

- name: Evaluate credential checks
  ansible.builtin.set_fact:
    aap_secure_api_results: "{{ aap_secure_api_results | default([]) + _cred_results }}"
  vars:
    _has_vault: "{{ _external_vault_creds | length > 0 }}"
    _cred_results:
      - name: External Secret Management
        domain: Credentials
        status: >-
          {%- if not _cred_api_available -%}SKIPPED
          {%- elif _has_vault -%}PASS
          {%- elif (_total_creds | int) > 0 -%}WARNING
          {%- else -%}SKIPPED{%- endif -%}
        current_value: >-
          {%- if not _cred_api_available -%}N/A - API unavailable
          {%- elif _has_vault -%}{{ _external_vault_creds | length }} external vault credential(s) configured
          {%- else -%}No external vault credentials found ({{ _total_creds }} total credentials){%- endif -%}
        recommended_value: "External vault configured (HashiCorp/CyberArk/AWS/Azure)"
        description: "Credentials should use external secret management"
        remediation: "Configure credential lookups to external vault system"
        reference: "AAP Secure 2.7 - External credential vault considerations"

      - name: Credential Count
        domain: Credentials
        status: >-
          {%- if not _cred_api_available -%}SKIPPED
          {%- else -%}PASS{%- endif -%}
        current_value: "{{ _total_creds }} credentials in platform"
        recommended_value: "Audit regularly"
        description: "Total credentials count for audit visibility"
        remediation: "Review credentials periodically, remove unused entries"
        reference: "AAP Secure 2.7 - Manage platform credentials"

      - name: no_log Protection
        domain: Credentials
        status: WARNING
        current_value: "Requires manual review of playbooks"
        recommended_value: "All sensitive tasks use no_log: true"
        description: "Sensitive data must not appear in logs"
        remediation: "Add no_log: true to tasks handling secrets"
        reference: "AAP Secure 2.7 - Protect sensitive data with no_log"
