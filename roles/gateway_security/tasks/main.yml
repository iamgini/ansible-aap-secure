---
# gateway_security - Gateway and controller settings checks
# Gateway API: SESSION_COOKIE_AGE, CSRF_TRUSTED_ORIGINS, ALLOW_OAUTH2_FOR_EXTERNAL_USERS
# Controller API: REMOTE_HOST_HEADERS, ACTIVITY_STREAM, INSIGHTS_TRACKING

- name: Merge gateway baseline with customer overrides
  ansible.builtin.set_fact:
    _gw: "{{ gateway_baseline | combine(gateway_overrides | default({}), recursive=true) }}"

- name: Query gateway settings
  ansible.builtin.uri:
    url: "{{ _aap_api_url }}/api/gateway/v1/settings/all/"
    method: GET
    url_username: "{{ omit if (aap_token | default('', true) | length > 0) else (aap_username | default(omit)) }}"
    url_password: "{{ omit if (aap_token | default('', true) | length > 0) else (aap_password | default(omit)) }}"
    force_basic_auth: "{{ (aap_token | default('', true) | length == 0) and (aap_username is defined) }}"
    headers: "{{ {'Authorization': 'Bearer ' + aap_token} if (aap_token | default('', true) | length > 0) else {} }}"
    validate_certs: "{{ aap_validate_certs | default(true) }}"
    status_code: [200]
  register: _gw_settings
  failed_when: false
  no_log: true

- name: Query controller system settings
  ansible.builtin.uri:
    url: "{{ _aap_api_url }}/api/controller/v2/settings/system/"
    method: GET
    url_username: "{{ omit if (aap_token | default('', true) | length > 0) else (aap_username | default(omit)) }}"
    url_password: "{{ omit if (aap_token | default('', true) | length > 0) else (aap_password | default(omit)) }}"
    force_basic_auth: "{{ (aap_token | default('', true) | length == 0) and (aap_username is defined) }}"
    headers: "{{ {'Authorization': 'Bearer ' + aap_token} if (aap_token | default('', true) | length > 0) else {} }}"
    validate_certs: "{{ aap_validate_certs | default(true) }}"
    status_code: [200]
  register: _sys_settings
  failed_when: false
  no_log: true

- name: Show API response details
  ansible.builtin.debug:
    msg: >-
      Gateway API: {{ _gw_settings.status | default('no response') }}
      ({{ _gw_settings.msg | default('no message') }}) |
      Controller API: {{ _sys_settings.status | default('no response') }}
      ({{ _sys_settings.msg | default('no message') }}) |
      URL: {{ _gw_settings.url | default('unknown') }} |
      validate_certs: {{ aap_validate_certs | default(true) }}

- name: Set API availability flag
  ansible.builtin.set_fact:
    _gw_api_available: "{{ _gw_settings.status | default(0) == 200 }}"
    _sys_api_available: "{{ _sys_settings.status | default(0) == 200 }}"

- name: Evaluate gateway security checks
  ansible.builtin.set_fact:
    aap_secure_api_results: "{{ aap_secure_api_results | default([]) + _gateway_results }}"
  vars:
    _gw_json: "{{ _gw_settings.json | default({}) }}"
    _sys_json: "{{ _sys_settings.json | default({}) }}"
    _gateway_results:
      - name: SESSION_COOKIE_AGE
        domain: Gateway Security
        status: >-
          {%- if not _gw_api_available -%}SKIPPED
          {%- elif (_gw_json.SESSION_COOKIE_AGE | default(0) | int) <= (_gw.SESSION_COOKIE_AGE | int) -%}PASS
          {%- else -%}FAIL{%- endif -%}
        current_value: "{{ _gw_json.SESSION_COOKIE_AGE | default('N/A - API unavailable') }}"
        recommended_value: "<= {{ _gw.SESSION_COOKIE_AGE }} seconds"
        description: "Session cookie lifetime in seconds"
        remediation: "Set SESSION_COOKIE_AGE to {{ _gw.SESSION_COOKIE_AGE }} or less"
        reference: "AAP Secure 2.7 - Configure platform gateway route timeouts"

      - name: CSRF_TRUSTED_ORIGINS
        domain: Gateway Security
        status: >-
          {%- if not _gw_api_available -%}SKIPPED
          {%- elif _gw_json.CSRF_TRUSTED_ORIGINS | default([]) | length > 0 -%}PASS
          {%- else -%}WARNING{%- endif -%}
        current_value: "{{ _gw_json.CSRF_TRUSTED_ORIGINS | default('N/A - API unavailable') }}"
        recommended_value: "Explicitly configured with gateway URLs"
        description: "CSRF trusted origins must be explicitly set"
        remediation: "Configure CSRF_TRUSTED_ORIGINS with known gateway URLs"
        reference: "AAP Secure 2.7 - Harden the platform security posture"

      - name: ALLOW_OAUTH2_FOR_EXTERNAL_USERS
        domain: Gateway Security
        status: >-
          {%- if not _gw_api_available -%}SKIPPED
          {%- elif _gw_json.ALLOW_OAUTH2_FOR_EXTERNAL_USERS | default(true) == _gw.ALLOW_OAUTH2_FOR_EXTERNAL_USERS -%}PASS
          {%- else -%}FAIL{%- endif -%}
        current_value: "{{ _gw_json.ALLOW_OAUTH2_FOR_EXTERNAL_USERS | default('N/A - API unavailable') }}"
        recommended_value: "{{ _gw.ALLOW_OAUTH2_FOR_EXTERNAL_USERS }}"
        description: "Prevent external users from creating OAuth2 tokens"
        remediation: "Set ALLOW_OAUTH2_FOR_EXTERNAL_USERS to false"
        reference: "AAP Secure 2.7 - Security settings for OAuth2 tokens"

      - name: REMOTE_HOST_HEADERS
        domain: Gateway Security
        status: >-
          {%- if not _sys_api_available -%}SKIPPED
          {%- elif _sys_json.REMOTE_HOST_HEADERS | default([]) | length > 0 -%}PASS
          {%- else -%}WARNING{%- endif -%}
        current_value: "{{ _sys_json.REMOTE_HOST_HEADERS | default('N/A - API unavailable') }}"
        recommended_value: "{{ _gw.REMOTE_HOST_HEADERS }}"
        description: "Headers used to determine client IP address"
        remediation: "Set REMOTE_HOST_HEADERS to [REMOTE_ADDR, REMOTE_HOST]"
        reference: "AAP Secure 2.7 - Harden the platform security posture"

      - name: SESSION_COOKIE_SECURE
        domain: Gateway Security
        status: WARNING
        current_value: "Not exposed via AAP 2.7 API - verify in NGINX config"
        recommended_value: "{{ _gw.SESSION_COOKIE_SECURE }}"
        description: "Session cookies transmitted only over HTTPS"
        remediation: "Verify Secure flag in NGINX proxy configuration or Django settings"
        reference: "AAP Secure 2.7 - Harden the platform security posture"

      - name: SESSIONS_PER_USER
        domain: Gateway Security
        status: WARNING
        current_value: "Not exposed via AAP 2.7 API - verify in gateway configuration"
        recommended_value: "{{ _gw.SESSIONS_PER_USER }}"
        description: "Maximum concurrent sessions per user"
        remediation: "Verify session limits in gateway configuration"
        reference: "AAP Secure 2.7 - Harden the platform security posture"

- name: Remediate gateway settings
  when:
    - aap_secure_mode == 'remediate'
    - _gw_api_available
  block:
    - name: Apply gateway security settings
      ansible.builtin.uri:
        url: "{{ _aap_api_url }}/api/gateway/v1/settings/configuration/"
        method: PATCH
        url_username: "{{ omit if (aap_token | default('', true) | length > 0) else (aap_username | default(omit)) }}"
        url_password: "{{ omit if (aap_token | default('', true) | length > 0) else (aap_password | default(omit)) }}"
        force_basic_auth: "{{ (aap_token | default('', true) | length == 0) and (aap_username is defined) }}"
        headers: >-
          {{ {'Authorization': 'Bearer ' + aap_token, 'Content-Type': 'application/json'}
             if (aap_token | default('', true) | length > 0)
             else {'Content-Type': 'application/json'} }}
        validate_certs: "{{ aap_validate_certs | default(true) }}"
        body_format: json
        body:
          SESSION_COOKIE_AGE: "{{ _gw.SESSION_COOKIE_AGE }}"
        status_code: [200]
      failed_when: false
      no_log: true
