---
all:
  children:
    aap_gateway:
      hosts:
        gateway.example.com:
      vars:
        aap_hostname: "https://gateway.example.com"
        aap_username: "admin"
        aap_password: "{{ vault_aap_password }}"
        aap_validate_certs: true
        ansible_connection: local

    aap_hosts:
      hosts:
        controller1.example.com:
        hub1.example.com:
        eda1.example.com:
      vars:
        ansible_user: root

    managed_nodes:
      hosts:
        managed1.example.com:
        managed2.example.com:
      vars:
        ansible_user: ansible
        managed_node_service_account: ansible
